<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SplitBill</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>SplitBill</h1>
    <p class="sub">Split a restaurant bill, tip included.</p>
    <form id="split-form" novalidate>
      <label for="bill">Bill amount</label>
      <input id="bill" name="bill" type="number" min="0" step="0.01" placeholder="e.g. 120.00" required>
      <label for="tip">Tip percent</label>
      <input id="tip" name="tip" type="number" min="0" max="100" step="1" value="15" required>
      <label for="people">Number of people</label>
      <input id="people" name="people" type="number" min="1" step="1" value="2" required>
      <button id="calc" type="submit">Calculate</button>
    </form>
    <section id="result" aria-live="polite" hidden>
      <p>Tip: <strong id="tip-amount"></strong></p>
      <p>Total with tip: <strong id="total"></strong></p>
      <p class="each">Each person pays <strong id="per-person"></strong></p>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SplitBill</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M9 21h14M9 16h14M9 11h9' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header class="brand">
      <span class="logo" aria-hidden="true"></span>
      <div>
        <h1>SplitBill</h1>
        <p class="sub">Split a restaurant bill, tip included.</p>
      </div>
    </header>
    <form id="split-form" novalidate>
      <div class="field">
        <label for="bill">Bill amount</label>
        <div class="affix"><span class="pre" aria-hidden="true">$</span>
          <input id="bill" name="bill" type="number" min="0" step="0.01" placeholder="e.g. 120.00" inputmode="decimal" required>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="tip">Tip percent</label>
          <div class="affix"><input id="tip" name="tip" type="number" min="0" max="100" step="1" value="15" inputmode="numeric" required><span class="post" aria-hidden="true">%</span></div>
        </div>
        <div class="field">
          <label for="people">Number of people</label>
          <div class="affix"><input id="people" name="people" type="number" min="1" step="1" value="2" inputmode="numeric" required></div>
        </div>
      </div>
      <label class="toggle"><input id="round-up" name="round-up" type="checkbox"> Round up each share to the next whole dollar</label>
      <button id="calc" type="submit">Calculate</button>
    </form>
    <section id="result" aria-live="polite" hidden>
      <p class="each">Each person pays <strong id="per-person"></strong></p>
      <dl class="breakdown">
        <div><dt>Tip</dt><dd><strong id="tip-amount"></strong></dd></div>
        <div><dt>Total with tip</dt><dd><strong id="total"></strong></dd></div>
      </dl>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
    <footer class="foot"><span class="dot" aria-hidden="true"></span><span>Every change verified in a real browser by Kane CLI · <a href="https://github.com/qinheyi/kane-loop">kane-loop</a></span></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
